[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlas-engine"
version = "1.0.0"
description = "Decision ledger enforcing traceability from design decisions through PRD, issues, implementation, and verification"
readme = "../README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "Ryan Vo", email = "ryandtvo@gmail.com" },
]
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.32.0",
  "sqlalchemy==2.0.35",
  "aiosqlite==0.20.0",
  "alembic==1.13.2",
  "pydantic==2.9.2",
  "pydantic-settings==2.5.2",
  "PyJWT==2.9.0",
  "python-jose[cryptography]==3.3.0",
  "python-multipart==0.0.12",
  "httpx==0.27.2",
  "python-dotenv==1.0.1",
  "passlib[bcrypt]==1.7.4",
  "python-slugify==8.0.4",
  "ulid-py==1.1.0",
  "structlog==24.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.3",
  "pytest-asyncio==0.23.7",
  "pytest-cov==5.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"